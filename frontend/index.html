<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GromBricks — Всесвіт колекційних мініфігурок та деталей LEGO</title>
  
  <!-- Google Fonts: Unbounded + Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Remix Icon (Сучасні векторні іконки) -->

  <link rel="stylesheet" href="/src/style.css">

  <div class="site-wrapper">
    <!-- Хедер лендінгу -->
    <header class="site-header" id="app-header"></header>

      <div class="modal-header" style="margin-bottom:20px;border-bottom:1px solid rgba(230,191,85,0.4);padding-bottom:12px;">
