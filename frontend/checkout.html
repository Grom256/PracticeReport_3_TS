<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформлення замовлення — GromBricks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header" id="app-header"></header>

    <main class="main-content">
      <div class="checkout-page-container">
        <h1 class="page-heading">Оформлення замовлення</h1>
        <p class="page-subheading" style="margin-bottom:32px;">Введіть дані для отримання посилки з LEGO.</p>

        <div id="checkout-notification"></div>

        <form id="checkout-form" class="checkout-form-grid">
          <div class="checkout-fields-card">
            <div>
              <h3 class="form-section-title">1. Контактні дані</h3>
              <div class="form-grid-2">
                <div class="form-group">
                  <label class="form-label">Ім'я та прізвище <span class="required">*</span></label>
                  <input type="text" id="cust-name" class="form-input" required placeholder="Тарас Шевченко">
                </div>
                <div class="form-group">
                  <label class="form-label">Телефон <span class="required">*</span></label>
                  <input type="tel" id="cust-phone" class="form-input" required value="+380" placeholder="+380XXXXXXXXX">
                </div>
              </div>
              <div class="form-group" style="margin-top:14px;">
                <label class="form-label">Email <span class="required">*</span></label>
                <input type="email" id="cust-email" class="form-input" required placeholder="client@example.com">
              </div>
            </div>

            <div>
              <h3 class="form-section-title">2. Доставка по Україні</h3>
              <div class="form-grid-2">
                <div class="form-group">
                  <label class="form-label">Місто / Населений пункт <span class="required">*</span></label>
                  <input type="text" id="cust-city" class="form-input" required placeholder="Київ">
                </div>
                <div class="form-group">
                  <label class="form-label">Відділення / Поштомат Нової Пошти <span class="required">*</span></label>
                  <input type="text" id="cust-branch" class="form-input" required placeholder="Відділення №1">
                </div>
              </div>
            </div>

            <div>
              <h3 class="form-section-title">3. Оплата</h3>
              <div class="payment-options-grid">
                <label class="payment-option selected">
                  <input type="radio" name="payment" value="card_transfer" checked style="accent-color:#e6bf55;">
                  <div>
                    <div class="payment-option-name">Оплата за реквізитами (IBAN / Картка)</div>
                    <div class="payment-option-desc">Без комісії за накладений платіж</div>
                  </div>
                </label>
                <label class="payment-option">
                  <input type="radio" name="payment" value="cash_on_delivery" style="accent-color:#e6bf55;">
                  <div>
                    <div class="payment-option-name">Накладений платіж</div>
                    <div class="payment-option-desc">Оплата при отриманні на пошті</div>
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div class="checkout-summary-card">
            <h3 class="checkout-summary-title">Ваше замовлення</h3>
            <div id="checkout-items-list" class="checkout-items-mini-list"></div>
            <div class="summary-divider" style="margin:16px 0;"></div>
            <div class="summary-total-row">
              <span>До сплати:</span>
              <span id="checkout-total-price" class="total-highlight">0 ₴</span>
            </div>
            <button type="submit" id="btn-submit" class="btn btn-primary btn-submit-order">
              ПІДТВЕРДИТИ ЗАМОВЛЕННЯ
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer" id="app-footer"></footer>
  </div>

  <script type="module" src="/src/checkoutPage.ts"></script>
</body>
</html>
